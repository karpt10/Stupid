<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>You're Stupid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- The original box to click -->
    <div class="trigger-box" onclick="showModal()">
        Click Me
    </div>

    <!-- The modal pop-up structure -->
    <div id="myModal" class="modal">
        <!-- The modal content -->
        <div class="modal-content">
            <!-- The close button -->
            <span class="close-button" onclick="closeModal()">&times;</span>
            <p>You're stupid</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
